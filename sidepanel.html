<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>My Side Panel</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="sidepanel-container">
      <header class="sidepanel-header">
        <figure>
          <img
            class="sidepanel-logo"
            src="./icons/icon-48.png"
            alt="History-Theatre-Ludus hybrid symbol."
          />
        </figure>
        <h1>Ludus HT Helper</h1>
      </header>

      <main class="sidepanel-content">
        <div class="active-tab-info">
          <h3>Current Tab:</h3>
          <p id="tab-url">Loading...</p>
        </div>

        <button id="ludus-btn">Arrange Price-Points</button>
        <p id="greet-message"></p>
      </main>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
