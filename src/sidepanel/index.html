<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ludus HT Helper</title>
  </head>
  <body>
    <div class="sidepanel-container">
      <header class="sidepanel-header">
        <figure>
          <img
            class="sidepanel-logo"
            src="/icons/icon-48.png"
            alt="History-Theatre-Ludus hybrid symbol."
          />
        </figure>
        <h1>Ludus HT Helper</h1>
      </header>

      <main class="sidepanel-content">
        <div class="active-tab-info">
          <h3>Current Tab:</h3>
          <p id="tab-url">Loading...</p>
        </div>

        <details class="accordion" id="sort-task">
          <summary class="side-button" id="sort-price-points">
            Arrange Price-Points
          </summary>

          <div class="accordion-content">
            <p class="hint" id="sort-help">
              Use the arrow buttons to change the order, then confirm.
            </p>
            <ol
              id="type-list"
              aria-label="Ticket type order"
              aria-describedby="sort-help"
            ></ol>
            <div class="actions">
              <button class="btn" id="sort-confirm">Confirm &amp; sort</button>
              <button class="btn btn--secondary" id="sort-reset">
                Reset order
              </button>
            </div>
            <p id="sort-status" role="status"></p>
          </div>
        </details>
      </main>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
